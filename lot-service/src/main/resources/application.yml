spring:
  application:
    name: lot-service
  config:
    import: "optional:configserver:http://localhost:8888"
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

logging:
  level:
    imbuy.lot: DEBUG