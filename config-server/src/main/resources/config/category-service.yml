server:
  port: 8081

spring:
  application:
    name: category-service
  datasource:
    url: jdbc:postgresql://localhost:5434/category_db
    username: imbuy
    password: secret
  r2dbc:
    url: r2dbc:postgresql://localhost:5434/category_db
    username: imbuy
    password: secret
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    use-root-path: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    imbuy.category: DEBUG
    org.hibernate.SQL: DEBUG

