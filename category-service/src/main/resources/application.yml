server:
  port: 8081

spring:
  application:
    name: category-service
  datasource:
    url: jdbc:postgresql://localhost:5434/category_db
    username: imbuy
    password: secret
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: true
        format_sql: true
  liquibase:
    enabled: false  # Пока отключим, настроим позже

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

logging:
  level:
    imbuy.category: DEBUG
    org.hibernate.SQL: DEBUG